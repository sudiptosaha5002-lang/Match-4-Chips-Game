<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <title>Download - MATCH 4 CHIPS</title>
    <style>
        body {
            justify-content: flex-start;
            padding-top: 80px;
        }
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            color: #00f2fe;
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 50px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .back-btn:hover {
            background: #00f2fe;
            color: #0f172a;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
            transform: translateX(5px);
        }
        .download-page-wrapper {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            z-index: 10;
        }
        .download-container-box {
            background: rgba(0, 255, 255, 0.1);
            border: 5px solid rgb(255, 252, 252);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .download-btn-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            width: 100%;
        }
        @media (min-width: 1000px) {
            .download-btn-grid {
                grid-template-columns: 1fr 1fr;
            }
            .install-btn-main { grid-column: span 2; }
        }
        .back-home-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 25px;
            background: rgba(255, 255, 255, 0.1);
            border: 3px solid #fff;
            border-radius: 16px;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.2s ease;
            margin-top: 20px;
        }
        .back-home-btn:hover {
            transform: translateY(-3px);
            background: #fff;
            color: #0f172a;
        }
        /* Custom alert for iPhone */
        #ios-notice {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #fff;
            border-radius: 10px;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <canvas id="bg"></canvas>
    
    <div class="logo" style="text-align: left; padding-left: 5vw; margin-top: 20px;">
        <img src="logo.png" class="logo1" />
    </div>

    <div class="content-wrapper" style="margin-top: 0;">
        <div class="intro">
            <h1 style="font-size: clamp(32px, 8vw, 50px);">INSTALL</h1>
            <h2 style="margin-bottom: 30px;">Install the app to play offline anywhere!</h2>
            
            <div class="btn-group">
                <a href="index.html" class="back-home-btn">
                    <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                    <span>BACK TO GAME</span>
                </a>
            </div>
        </div>

        <div class="download-container-box">
            <div class="download-btn-grid" id="install-container">
                <!-- Direct Install Button -->
                <button id="install-btn" class="download-btn windows install-btn-main" style="width: 100%; border: 3px solid #00f2fe; background: rgba(0, 242, 254, 0.15);">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                    <div class="download-btn-text">
                        <span class="download-label">Direct Install</span>
                        <span class="download-platform">WEB APP</span>
                    </div>
                </button>

                <p style="color: rgba(255,255,255,0.6); grid-column: span 2; font-family: 'Orbitron', sans-serif; font-size: 12px; margin: 10px 0;">Or use platform specific options:</p>

                <button class="download-btn windows platform-install">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M0 3.449L9.75 2.1v9.451H0m10.949-9.602L24 0v11.4H10.949M0 12.6h9.75v9.451L0 20.699M10.949 12.6H24V24l-12.9-1.801"/></svg>
                    <div class="download-btn-text">
                        <span class="download-label">Install for</span>
                        <span class="download-platform">Windows</span>
                    </div>
                </button>
                <button class="download-btn mac platform-install">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
                    <div class="download-btn-text">
                        <span class="download-label">Install for</span>
                        <span class="download-platform">macOS</span>
                    </div>
                </button>
                <button class="download-btn android platform-install">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.523 15.341a1.015 1.015 0 01-1.016-1.016c0-.562.453-1.015 1.016-1.015a1.015 1.015 0 11-.001 2.031zm-11.046 0a1.015 1.015 0 01-1.016-1.016c0-.562.453-1.015 1.016-1.015a1.015 1.015 0 11-.001 2.031zm11.405-6.02l1.96-3.396a.416.416 0 00-.152-.567.416.416 0 00-.567.152l-1.986 3.44A12.306 12.306 0 0012 7.467c-1.812 0-3.521.393-5.137 1.483L4.877 5.51a.416.416 0 00-.567-.152.416.416 0 00-.152.567l1.96 3.396C2.689 11.435.482 15.068.482 19.241h23.036c0-4.173-2.207-7.806-5.636-9.92z"/></svg>
                    <div class="download-btn-text">
                        <span class="download-label">Install for</span>
                        <span class="download-platform">Android</span>
                    </div>
                </button>
                <button class="download-btn iphone" id="iphone-btn">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
                    <div class="download-btn-text">
                        <span class="download-label">Install for</span>
                        <span class="download-platform">iPhone</span>
                    </div>
                </button>

                <div id="ios-notice">
                    📱 **On iPhone/iPad:** Tap the **Share** button in Safari (box with arrow) and select **"Add to Home Screen"**.
                </div>
            </div>
        </div>
    </div>

    <script src="bgscript.js"></script>
    <script>
        let deferredPrompt;
        const installBtn = document.getElementById('install-btn');
        const platformBtns = document.querySelectorAll('.platform-install');
        const iphoneBtn = document.getElementById('iphone-btn');
        const iosNotice = document.getElementById('ios-notice');

        // Capture the install prompt event
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            // Show the install button now that the event is captured
            console.log('Install prompt captured');
        });

        async function triggerInstall() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                console.log(`User response to install prompt: ${outcome}`);
                deferredPrompt = null;
            } else {
                alert("Installation is handled by your browser. Look for an 'Install' or 'Add to Home Screen' option in your browser menu!");
            }
        }

        // Add listeners
        installBtn.addEventListener('click', triggerInstall);
        
        // Platform buttons show Coming Soon
        platformBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                alert("Coming Soon!!!\nPlatform-specific native apps are currently in development. Please use the 'Direct Install' button above to install the Web App version!");
            });
        });

        iphoneBtn.addEventListener('click', () => {
            iosNotice.style.display = 'block';
            iosNotice.scrollIntoView({ behavior: 'smooth' });
        });

        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registered!'))
                    .catch(err => console.log('Service Worker failed:', err));
            });
        }
    </script>
</body>
</html>
