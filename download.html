    <style>
        /* Custom adjustments for the download page to match game layout */
        .download-container-box {
            background: rgba(0, 255, 255, 0.1);
            border: 5px solid rgb(255, 252, 252);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        
        .download-btn-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            width: 100%;
        }

        @media (min-width: 1000px) {
            .download-btn-grid {
                grid-template-columns: 1fr 1fr;
            }
            .download-btn.windows { grid-column: span 2; } /* Make windows button wide */
        }

        .back-home-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 25px;
            background: rgba(255, 255, 255, 0.1);
            border: 3px solid #fff;
            border-radius: 16px;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.2s ease;
            margin-top: 20px;
        }

        .back-home-btn:hover {
            transform: translateY(-3px);
            background: #fff;
            color: #0f172a;
        }
    </style>
